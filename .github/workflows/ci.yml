# =====================================================
# TH79 HRM Frontend - CI Pipeline
# Build & validate on every push/PR to main and develop
# =====================================================
name: CI - Build & Validate

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    name: "Build (Node ${{ matrix.node-version }})"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build
        env:
          VITE_API_URL: https://api.hrm.daututh79.com

      - name: Check bundle size
        run: |
          echo "=== Build Output ==="
          du -sh dist/
          echo ""
          echo "=== Top 15 largest files ==="
          find dist/ -type f -exec du -h {} + | sort -rh | head -15

      - name: Upload build artifact
        if: matrix.node-version == 20
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/
          retention-days: 7